<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10499b">
<title>Connecticut Akhand Keertan Samaagam</title>
<meta name="description" content="Connecticut Akhand Keertan Samaagam — October 1 to 4, 2026. Schedule, directions, accommodation and travel information.">
<meta property="og:title" content="Connecticut Akhand Keertan Samaagam">
<meta property="og:description" content="October 1 to 4, 2026 · Gurdwara Guru Nanak Darbar, Southington, CT">
<meta property="og:image" content="assets/hero.jpg">
<meta property="og:type" content="website">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="hero__bar">
    <div class="langtoggle" role="group" aria-label="Language">
      <button type="button" id="langEn" class="langtoggle__btn" aria-pressed="true">English</button>
      <button type="button" id="langPa" class="langtoggle__btn" aria-pressed="false" lang="pa">ਪੰਜਾਬੀ</button>
    </div>
  </div>

  <img class="hero__image" src="assets/hero.jpg" alt="Sri Harmandir Sahib" fetchpriority="high">

  <div class="hero__titles">
    <h1 class="hero__title" id="title"></h1>
    <p class="hero__dates" id="dates"></p>
  </div>
</header>

<p class="occasion" id="occasion"></p>

<main class="wrap">

  <section class="section section--schedule">
    <h2 id="hSchedule"></h2>
    <div class="days" id="schedule"></div>
    <button class="textlink" id="addCal" type="button">
      <span id="addCalLabel"></span>
      <span class="textlink__sub" id="addCalSub"></span>
    </button>
  </section>

  <section class="section">
    <h2 id="hLocation"></h2>
    <div class="venue">
      <p class="venue__name" id="venueName"></p>
      <p class="venue__addr" id="venueAddr"></p>
    </div>
    <div class="btnrow">
      <a class="btn btn--quiet" id="mapsGoogle" target="_blank" rel="noopener"></a>
      <a class="btn btn--quiet" id="mapsApple" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <section class="section">
    <h2 id="hForms"></h2>
    <div class="cards" id="forms"></div>
  </section>

  <section class="section">
    <h2 id="hAirports"></h2>
    <div class="airports" id="airports"></div>
  </section>

  <section class="section">
    <h2 id="hContact"></h2>
    <div class="contacts" id="contacts"></div>
  </section>

</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
